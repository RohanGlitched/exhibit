name: Refill the case pool

# Keeps two ready sandbox cases per story on https://exhibit-desk.vercel.app through judging (Dec 1-15).
# Needs the repository secret CRON_SECRET (the same value as the Vercel env var).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/pool
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::Add the CRON_SECRET repository secret."; exit 1; fi
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST --max-time 90 \
            -H "authorization: Bearer $CRON_SECRET" -H "x-refill-by: github" \
            https://exhibit-desk.vercel.app/api/pool || echo 000)
          echo "HTTP $code"
          jq -c '{opened: (.opened // [] | length), retired: (.retired // [] | length), errors: (.errors // [])}' out.json || true
          [ "$code" = "200" ]
